name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_COLOR: '1'

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-not-a-production-secret
      DJANGO_DEBUG: '0'
      DJANGO_TESTING: '1'
      DB_NAME: testdb
      DB_USER: test
      DB_PASSWORD: test
      DB_HOST: localhost
      DB_PORT: '5432'
      TEST_DB_NAME: testdb
      TEST_DB_USER: test
      TEST_DB_PASSWORD: test
      TEST_DB_HOST: localhost
      TEST_DB_PORT: '5432'
      TURNSTILE_SKIP_VERIFY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: .
        run: uv sync --frozen

      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run pytest
        run: uv run pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy production
    needs:
      - backend
      - frontend
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Show commit being deployed
        run: |
          echo "Deploying commit ${GITHUB_SHA}"
          echo "deployment start"

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?VPS_HOST secret is required}"
          : "${VPS_USER:?VPS_USER secret is required}"
          : "${VPS_SSH_PRIVATE_KEY:?VPS_SSH_PRIVATE_KEY secret is required}"
          SSH_PORT="${VPS_SSH_PORT:-22}"
          if [ -z "${SSH_PORT}" ]; then
            SSH_PORT=22
          fi

          umask 077
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          ssh-keyscan -p "${SSH_PORT}" -H "${VPS_HOST}" \
            >> "${HOME}/.ssh/known_hosts"

          echo "SSHing to ${VPS_USER}@${VPS_HOST} to run deploy.sh"
          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -p "${SSH_PORT}" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" \
            '/opt/stacks/my_blog/deploy.sh'
