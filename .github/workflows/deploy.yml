name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_COLOR: '1'
  BACKEND_IMAGE: ghcr.io/kirillgorodetskiy/my-blog-backend
  FRONTEND_IMAGE: ghcr.io/kirillgorodetskiy/my-blog-frontend

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-not-a-production-secret
      DJANGO_DEBUG: '0'
      DJANGO_TESTING: '1'
      DB_NAME: testdb
      DB_USER: test
      DB_PASSWORD: test
      DB_HOST: localhost
      DB_PORT: '5432'
      TEST_DB_NAME: testdb
      TEST_DB_USER: test
      TEST_DB_PASSWORD: test
      TEST_DB_HOST: localhost
      TEST_DB_PORT: '5432'
      TURNSTILE_SKIP_VERIFY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: .
        run: uv sync --frozen

      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run pytest
        run: uv run pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

  image-backend:
    name: Build backend image
    needs:
      - backend
      - frontend
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.run_started_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=my-blog-backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  image-frontend:
    name: Build frontend image
    needs:
      - backend
      - frontend
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://gkablog.com
            INTERNAL_API_URL=http://backend:8000
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.run_started_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=my-blog-frontend
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy production
    needs:
      - image-backend
      - image-frontend
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Show commit being deployed
        run: |
          echo "Deploying commit ${GITHUB_SHA}"
          echo "backend ${BACKEND_IMAGE}:${GITHUB_SHA}"
          echo "frontend ${FRONTEND_IMAGE}:${GITHUB_SHA}"

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?VPS_HOST secret is required}"
          : "${VPS_USER:?VPS_USER secret is required}"
          : "${VPS_SSH_PRIVATE_KEY:?VPS_SSH_PRIVATE_KEY secret is required}"
          : "${IMAGE_TAG:?IMAGE_TAG is required}"
          SSH_PORT="${VPS_SSH_PORT:-22}"
          if [ -z "${SSH_PORT}" ]; then
            SSH_PORT=22
          fi

          umask 077
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          ssh-keyscan -p "${SSH_PORT}" -H "${VPS_HOST}" \
            >> "${HOME}/.ssh/known_hosts"

          echo "SSHing to ${VPS_USER}@${VPS_HOST} to pull ${IMAGE_TAG}"
          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -p "${SSH_PORT}" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "IMAGE_TAG=$(printf '%q' "${IMAGE_TAG}") \
             GHCR_USER=$(printf '%q' "${GHCR_USER}") \
             GHCR_TOKEN=$(printf '%q' "${GHCR_TOKEN}") \
             /opt/stacks/my_blog/deploy.sh"
