<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ post.title }} | My Blog</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">

    <!-- 📝 Post Header -->
    <div class="mb-4">
      <h1 class="text-primary">{{ post.title }}</h1>
      <p class="text-muted">🆔 ID: {{ post.id }}</p>
      <small class="text-secondary">Published at: {{ post.created_at|date:"M d, Y H:i" }}</small>
    </div>

    <!-- 📄 Post Body -->
    <div class="mb-5">
      <p class="fs-5">{{ post.body }}</p>
    </div>

    <!-- 🗑 Delete Button -->
    <form method="post" action="{% url 'delete_post' post.id %}" class="mb-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger"
              onclick="return confirm('Are you sure you want to delete this post?');">
        🗑 Delete Post
      </button>
      <a href="/" class="btn btn-secondary ms-2">⬅ Back to Home</a>
    </form>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
