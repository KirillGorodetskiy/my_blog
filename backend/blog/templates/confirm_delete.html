<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confirm Delete | My Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --danger-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .confirm-container {
      max-width: 500px;
      width: 100%;
      animation: fadeInUp 0.6s ease;
    }
    
    .confirm-card {
      background: white;
      border-radius: 1.5rem;
      padding: 2.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      text-align: center;
    }
    
    .warning-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, rgba(245, 87, 108, 0.1), rgba(240, 147, 251, 0.1));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s infinite;
    }
    
    .warning-icon svg {
      width: 40px;
      height: 40px;
      color: #f5576c;
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 15px rgba(245, 87, 108, 0);
      }
    }
    
    .confirm-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: #1a202c;
      margin-bottom: 1rem;
    }
    
    .confirm-message {
      font-size: 1.1rem;
      color: #4a5568;
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }
    
    .object-name {
      font-weight: 700;
      color: #f5576c;
      display: block;
      margin: 1rem 0;
      padding: 0.75rem;
      background: linear-gradient(135deg, rgba(245, 87, 108, 0.05), rgba(240, 147, 251, 0.05));
      border-radius: 0.5rem;
      border-left: 4px solid #f5576c;
    }
    
    .warning-text {
      font-size: 0.95rem;
      color: #718096;
      margin-bottom: 2rem;
      font-weight: 500;
    }
    
    .button-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .btn-modern {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.75rem;
      border-radius: 0.75rem;
      font-weight: 600;
      border: none;
      transition: all 0.3s ease;
      text-decoration: none;
      cursor: pointer;
      font-size: 1rem;
      min-width: 140px;
      justify-content: center;
    }
    
    .btn-delete {
      background: var(--danger-gradient);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(245, 87, 108, 0.4);
    }
    
    .btn-delete:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(245, 87, 108, 0.5);
      color: white;
    }
    
    .btn-delete:active {
      transform: translateY(0);
    }
    
    .btn-cancel {
      background: white;
      color: #4a5568;
      border: 2px solid #e2e8f0;
    }
    
    .btn-cancel:hover {
      border-color: #cbd5e0;
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      color: #4a5568;
    }
    
    .btn-cancel:active {
      transform: translateY(0);
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @media (max-width: 768px) {
      .confirm-card {
        padding: 2rem 1.5rem;
      }
      
      .confirm-title {
        font-size: 1.5rem;
      }
      
      .confirm-message {
        font-size: 1rem;
      }
      
      .button-group {
        flex-direction: column;
      }
      
      .btn-modern {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="confirm-container">
    <div class="confirm-card">
      
      <!-- Warning Icon -->
      <div class="warning-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-exclamation-triangle" viewBox="0 0 16 16">
          <path d="M7.938 2.016A.13.13 0 0 1 8.002 2a.13.13 0 0 1 .063.016.146.146 0 0 1 .054.057l6.857 11.667c.036.06.035.124.002.183a.163.163 0 0 1-.054.06.116.116 0 0 1-.066.017H1.146a.115.115 0 0 1-.066-.017.163.163 0 0 1-.054-.06.176.176 0 0 1 .002-.183L7.884 2.073a.147.147 0 0 1 .054-.057zm1.044-.45a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566z"/>
          <path d="M7.002 12a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 5.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995z"/>
        </svg>
      </div>

      <!-- Confirmation Title -->
      <h1 class="confirm-title">Are you sure?</h1>
      
      <!-- Confirmation Message -->
      <p class="confirm-message">You are about to delete:</p>
      
      <!-- Object Name -->
      <div class="object-name">{{ object_name }}</div>
      
      <!-- Warning Text -->
      <p class="warning-text">⚠️ This action cannot be undone!</p>

      <!-- Action Buttons -->
      <form method="post">
        {% csrf_token %}
        <div class="button-group">
          <button type="submit" class="btn-modern btn-delete">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
              <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
              <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
            </svg>
            {{ button_text }}
          </button>
          <a href="javascript:history.back()" class="btn-modern btn-cancel">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-x-circle" viewBox="0 0 16 16">
              <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
              <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
            </svg>
            Cancel
          </a>
        </div>
      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
