<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ form_title }} | My Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      padding: 2rem 0;
    }
    
    .form-container {
      max-width: 700px;
      margin: 0 auto;
      animation: fadeInUp 0.6s ease;
    }
    
    .page-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .page-title {
      font-size: 2.5rem;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    
    .page-subtitle {
      color: #718096;
      font-size: 1.1rem;
    }
    
    .form-card {
      background: white;
      border-radius: 1.5rem;
      padding: 2.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    .form-label {
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    
    .form-control, .form-select {
      border: 2px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: #f7fafc;
    }
    
    .form-control:focus, .form-select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      background: white;
      outline: none;
    }
    
    textarea.form-control {
      min-height: 200px;
      resize: vertical;
    }
    
    .form-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 2px solid #e2e8f0;
    }
    
    .btn-modern {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 600;
      border: none;
      transition: all 0.3s ease;
      text-decoration: none;
      cursor: pointer;
      font-size: 1rem;
    }
    
    .btn-submit {
      background: var(--success-gradient);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(79, 172, 254, 0.4);
    }
    
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(79, 172, 254, 0.4);
      color: white;
    }
    
    .btn-back {
      background: white;
      color: #4a5568;
      border: 2px solid #e2e8f0;
    }
    
    .btn-back:hover {
      border-color: #cbd5e0;
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      color: #4a5568;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #4a5568;
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      transition: all 0.3s ease;
      background: white;
      box-shadow: var(--card-shadow);
      margin-bottom: 2rem;
    }
    
    .back-link:hover {
      color: #667eea;
      transform: translateX(-5px);
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @media (max-width: 768px) {
      .form-card {
        padding: 1.5rem;
      }
      
      .page-title {
        font-size: 2rem;
      }
      
      .form-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="form-container">

      <!-- Back Link -->
      <a href="{% url 'home' %}" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
        </svg>
        Back to Home
      </a>

      <!-- Page Header -->
      <div class="page-header">
        <h1 class="page-title">{{ form_title }}</h1>
        <p class="page-subtitle">Share your thoughts with the world</p>
      </div>

      <!-- Form Card -->
      <div class="form-card">
        <form method="post">
        {% csrf_token %}

          <div class="mb-4">
            <label class="form-label">{{ form.title.label }}</label>
          {{ form.title }}
            {% if form.title.errors %}
              <div class="text-danger mt-2">{{ form.title.errors }}</div>
            {% endif %}
        </div>

          <div class="mb-4">
            <label class="form-label">{{ form.body.label }}</label>
          {{ form.body }}
            {% if form.body.errors %}
              <div class="text-danger mt-2">{{ form.body.errors }}</div>
            {% endif %}
        </div>

          <div class="form-buttons">
            <button type="submit" class="btn-modern btn-submit">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-check-circle" viewBox="0 0 16 16">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                <path d="M10.97 4.97a.235.235 0 0 0-.02.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05z"/>
              </svg>
              {{ button_text }}
            </button>
            <a href="{% url 'home' %}" class="btn-modern btn-back">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-x-circle" viewBox="0 0 16 16">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
              </svg>
              Cancel
            </a>
          </div>
      </form>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
