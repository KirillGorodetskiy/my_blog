# Compose interpolates ${VAR} from the process environment.
# Locally that is the project `.env` file. On the VPS,
# `doppler run` injects my-blog/prd. Do not commit secrets.
# There is no `env_file: .env`, so production does not need
# a plaintext dotenv file.
#
# Local: docker compose up --build
# Production: docker compose -f docker-compose.yml
#   -f docker-compose.prod.yml (GHCR images, no build)

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/dumps:/dumps:ro
    healthcheck:
      test: [
        'CMD-SHELL',
        'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'
      ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: postgres
      DUMP_DIR: /dumps
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SERVE_MEDIA: ${DJANGO_SERVE_MEDIA:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_BEHIND_PROXY: ${DJANGO_BEHIND_PROXY:-0}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-0}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SKIP_VERIFY: ${TURNSTILE_SKIP_VERIFY:-0}
      COMMENT_RATE_PER_MINUTE: ${COMMENT_RATE_PER_MINUTE:-3}
      COMMENT_RATE_PER_10_MINUTES: ${COMMENT_RATE_PER_10_MINUTES:-10}
      COMMENT_RATE_PER_DAY: ${COMMENT_RATE_PER_DAY:-30}
      LOAD_DJANGO_FIXTURES: ${LOAD_DJANGO_FIXTURES:-0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - ./db/dumps:/dumps:ro
      - ${MEDIA_HOST_PATH:-./backend/media}:/app/backend/media
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: [
        'CMD',
        'python',
        '-c',
        'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz/")'
      ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://gkablog.com}
        INTERNAL_API_URL: http://backend:8000
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://gkablog.com}
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
