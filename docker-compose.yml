services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/dumps:/dumps:ro
    healthcheck:
      test: [
        'CMD-SHELL',
        'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'
      ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      DUMP_DIR: /dumps
    volumes:
      - ./db/dumps:/dumps:ro
      - backend_media:/app/backend/media
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: [
        'CMD',
        'python',
        '-c',
        'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/admin/login/")'
      ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://gkablog.com}
        INTERNAL_API_URL: http://backend:8000
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://gkablog.com}
      INTERNAL_API_URL: http://backend:8000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_media:
